<!doctype html><html><head><link rel="stylesheet" href="/node_modules/leaflet/dist/leaflet.css"></head><body style="margin:0">
<div id="m" style="width:1280px;height:1000px"></div>
<script type="module">
import L from 'leaflet';
import 'leaflet/dist/leaflet.css';
import { loadTerritorialDataset, buildTerritorialLayerGroups } from '/src/lib/territorialLayers.ts';
const map = L.map('m').setView([-40.6, -72.9], 9);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
const ds = await loadTerritorialDataset();
const g = buildTerritorialLayerGroups(map, ds);
window.__g = g; window.__map = map;
g.get('territory').addTo(map); g.get('fire').addTo(map);
window.__ready = true;
</script></body></html>
